[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osk-sense-ha"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.11"]

[project.optional-dependencies]
dev = [
  "pyright",
  "pytest",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["custom_components.osk_sense*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.osk_sense" = [
  "*.json",
  "brand/*.png",
  "protocol_data/*.json",
  "translations/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
